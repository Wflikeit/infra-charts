---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "onboarding-manager.fullname" . }}-vault-ssh-engine-wait
  labels:
    {{- include "onboarding-manager.labels" . | nindent 4 }}
data:
  wait.sh: |
    #!/bin/sh
    set -eu
    : "${VAULT_ADDR:?VAULT_ADDR must be set}"
    : "${VAULT_SSH_MOUNT:?VAULT_SSH_MOUNT must be set}"
    : "${VAULT_K8S_AUTH_ROLE:?VAULT_K8S_AUTH_ROLE must be set}"
    : "${VAULT_K8S_JWT_PATH:?VAULT_K8S_JWT_PATH must be set}"
    : "${MAX_ITER:?MAX_ITER must be set}"
    : "${SLEEP_SECS:?SLEEP_SECS must be set}"
    if [ "${VAULT_SKIP_VERIFY:-false}" = "true" ]; then
      export VAULT_SKIP_VERIFY=true
    fi
    i=0
    while [ "$i" -lt "$MAX_ITER" ]; do
      if TOKEN=$(vault write -field=token auth/kubernetes/login \
          "role=${VAULT_K8S_AUTH_ROLE}" \
          "jwt=@${VAULT_K8S_JWT_PATH}" 2>/dev/null); then
        export VAULT_TOKEN="$TOKEN"
        if PK=$(vault read -field=public_key "${VAULT_SSH_MOUNT}/config/ca" 2>/dev/null); then
          if [ -n "$(printf '%s' "$PK" | tr -d '[:space:]')" ]; then
            echo "Vault SSH CA is available at ${VAULT_SSH_MOUNT}/config/ca"
            exit 0
          fi
        fi
      fi
      i=$((i + 1))
      echo "waiting for Vault SSH engine (${VAULT_SSH_MOUNT}/config/ca), attempt $i of $MAX_ITER ..."
      sleep "$SLEEP_SECS"
    done
    echo "timeout waiting for Vault SSH engine at ${VAULT_SSH_MOUNT}/config/ca"
    exit 1
