{{- if .Values.bootstrap.tokenSecret.name }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vault-ssh-secrets-engine.fullname" . }}
  labels:
    {{- include "vault-ssh-secrets-engine.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "vault-ssh-secrets-engine.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["/bin/sh", "/scripts/bootstrap.sh"]
          env:
            - name: VAULT_ADDR
              value: {{ .Values.vault.address | quote }}
            {{- if .Values.vault.skipTLSVerify }}
            - name: VAULT_SKIP_VERIFY
              value: "true"
            {{- end }}
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bootstrap.tokenSecret.name | quote }}
                  key: {{ .Values.bootstrap.tokenSecret.key | quote }}
                  {{- with .Values.bootstrap.tokenSecret.namespace }}
                  namespace: {{ . | quote }}
                  {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: {{ include "vault-ssh-secrets-engine.fullname" . }}-script
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
{{- end }}
