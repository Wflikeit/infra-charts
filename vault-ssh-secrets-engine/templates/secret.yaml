{{- if .Values.bootstrap.tokenSecret.create }}
{{- if not .Values.bootstrap.tokenSecret.name }}
{{- fail "vault-ssh-secrets-engine: bootstrap.tokenSecret.name is required when create is true" }}
{{- end }}
{{- if not .Values.bootstrap.tokenSecret.vaultToken }}
{{- fail "vault-ssh-secrets-engine: bootstrap.tokenSecret.vaultToken is required when create is true (use SealedSecret / ExternalSecrets in production instead of committing tokens)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.bootstrap.tokenSecret.name | quote }}
  labels:
    {{- include "vault-ssh-secrets-engine.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with .Values.bootstrap.tokenSecret.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  {{ .Values.bootstrap.tokenSecret.key }}: {{ .Values.bootstrap.tokenSecret.vaultToken | quote }}
{{- end }}
